<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rBOM VIEW 一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css">
</head>
<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
        stlite.mount(
            {
                requirements: ["pandas", "pyodide-http"],
                entrypoint: "app.py",
                files: {
                    "app.py": `
import streamlit as st
import pandas as pd
import json
import time  # 描画の隙を作るために追加

# API設定
API_URL = "http://pfw-api/query"
API_KEY = "oG5^Ls%#20yq"

# ビュー定義
VIEWS = {
    "在庫受払予定": "V_在庫受払予定",
    "推定在庫一覧": "V_推定在庫一覧",
    "納期別引当残": "V_納期別引当残",
    "納期別発注残": "V_納期別発注残"
}

st.set_page_config(
    page_title="rBOM VIEW 一覧",
    page_icon="📊",
    layout="wide"
)

# CSS
st.markdown("""
<style>
    .block-container {
        padding-top: 1rem;
        padding-bottom: 0rem;
    }
    h1 {
        font-size: 1.5rem !important;
        margin-bottom: 0 !important;
    }
    .stTabs [data-baseweb="tab-list"] {
        gap: 24px;
    }
    .stTabs [data-baseweb="tab"] {
        padding-left: 8px;
        padding-right: 8px;
    }
    .stDeployButton {
        display: none !important;
    }
    #MainMenu, footer, header {
        visibility: hidden !important;
    }
</style>
""", unsafe_allow_html=True)


def fetch_all_data(view_name: str, status_container) -> pd.DataFrame:
    """APIからページネーションで全件取得（進捗をstatus_containerに表示）"""
    import pyodide_http
    pyodide_http.patch_all()

    import urllib.request

    all_rows = []
    columns = None
    offset = 0
    limit = 10000

    while True:
        payload = {
            "table": view_name,
            "limit": limit,
            "offset": offset
        }

        try:
            req = urllib.request.Request(
                API_URL,
                data=json.dumps(payload).encode('utf-8'),
                headers={
                    'Content-Type': 'application/json',
                    'X-API-KEY': API_KEY
                },
                method='POST'
            )

            with urllib.request.urlopen(req, timeout=120) as response:
                data = json.loads(response.read().decode('utf-8'))

            if columns is None:
                columns = data.get("columns", [])

            rows = data.get("rows", [])
            if not rows:
                break

            all_rows.extend(rows)

            # --- 進行状況を同じ場所に更新 ---
            status_container.write(f"現在 {len(all_rows):,} 件の取得完了...")
            time.sleep(0.01)

            if len(rows) < limit:
                break

            offset += limit

        except Exception as e:
            st.error(f"エラー: {str(e)}")
            return pd.DataFrame()

    if not all_rows:
        return pd.DataFrame()

    return pd.DataFrame(all_rows, columns=columns)


def main():
    st.markdown("#### rBOM VIEW 一覧")

    tabs = st.tabs(list(VIEWS.keys()))

    for i, (tab_name, view_name) in enumerate(VIEWS.items()):
        with tabs[i]:
            state_key = f"df_{view_name}"

            col1, col2 = st.columns([2, 5])
            with col1:
                if st.button("読み込み", key=f"btn_{view_name}"):
                    # st.status で囲む
                    with st.status(f"{tab_name} データを取得中...", expanded=True) as status:
                        # 最初に 0.1秒待つことで「読み込み中...」を確実に描画させる
                        time.sleep(0.1)

                        # 進捗表示用の場所を確保（同じ場所に更新される）
                        progress_placeholder = st.empty()

                        # データ取得関数に進捗表示用のプレースホルダーを渡す
                        df = fetch_all_data(view_name, progress_placeholder)

                        st.session_state[state_key] = df
                        status.update(label="取得完了！", state="complete", expanded=False)

                    # 状態を反映させるために再描画
                    st.rerun()

            with col2:
                if state_key in st.session_state and not st.session_state[state_key].empty:
                    st.caption(f"最終取得件数: {len(st.session_state[state_key]):,} 件")

            if state_key in st.session_state:
                df = st.session_state[state_key]
                if df.empty:
                    st.info("データがありません。読み込みボタンを押してください。")
                else:
                    st.dataframe(df, use_container_width=True, height=600, hide_index=True)

                    # CSVダウンロードボタン（右寄せ）
                    col_left, col_right = st.columns([5, 1])
                    with col_right:
                        csv = df.to_csv(index=False).encode('utf-8-sig')
                        st.download_button(
                            label="csvダウンロード",
                            data=csv,
                            file_name=f"{tab_name}_{pd.Timestamp.now().strftime('%Y%m%d_%H%M%S')}.csv",
                            mime="text/csv",
                            key=f"download_{view_name}"
                        )

if __name__ == "__main__":
    main()
`
                }
            },
            document.getElementById("root")
        );
    </script>
</body>
</html>
