services:
  # MySQL → SQLite 同期処理（cron）
  krd-sync-app:
    build: .
    container_name: krd-sync-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # ローカルディレクトリ（SQLiteデータベースとログ）
      - ./db:/app/db
      - ./logs:/app/logs
      # DBコピー先（共有フォルダ）
      - /home/docker-user/KakouDenpyo:/home/docker-user/KakouDenpyo

    # ホスト名解決の設定（KRD MySQLサーバー）
    extra_hosts:
      - "krd:172.29.167.101"

    # ログ設定
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ヘルスチェック
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - app-shared-net

  # KRD データ管理画面（Streamlit）
  krd-data-app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: krd-data-app
    restart: unless-stopped
    ports:
      - "8509:8509"
    volumes:
      # SQLiteデータベース（同期アプリと共有）
      - ./db:/app/db

    # ログ設定
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-shared-net

networks:
  app-shared-net:
    external: true
